<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Dynamics Diagram Tool</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lz-string/1.5.0/lz-string.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <!-- CodeMirror for syntax highlighting -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.9/codemirror.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.9/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.9/addon/mode/simple.min.js"></script>
    <link rel="stylesheet" href="styles/main.css">
    <script>
        // Initialize mermaid with startOnLoad: true to ensure diagrams render properly
        mermaid.initialize({
            startOnLoad: true,
            theme: 'base',
            securityLevel: 'loose',
            flowchart: {
                htmlLabels: true,
                curve: 'basis'
            }
        });
    </script>
</head>
<body class="bg-gray-100">

    <div class="bg-white shadow px-4 py-2 flex items-center justify-between flex-shrink-0">
        <h1 class="text-xl md:text-2xl font-bold text-gray-800">System Dynamics Diagram Tool</h1>
        <div class="flex flex-wrap gap-2 items-center">
            <button id="simulateBtn" class="px-4 py-1 bg-green-600 text-white rounded-md shadow hover:bg-green-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-green-500 text-sm">
                Run Simulation
            </button>
            <div class="relative inline-block text-left dropdown-container">
                <button id="actionsDropdownBtn" class="px-3 py-1 bg-blue-500 text-white rounded-md shadow hover:bg-blue-600 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-400 text-xs flex items-center">
                    Actions <svg class="w-4 h-4 ml-1" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                </button>
                <div id="actionsDropdown" class="dropdown-menu absolute right-0 mt-2 w-48 rounded-md shadow-lg bg-white ring-1 ring-black ring-opacity-5 hidden z-10">
                    <div class="py-1">
                        <button id="copyLinkBtn" class="w-full text-left block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100">
                            Copy Link
                        </button>
                        <button id="docsBtn" class="w-full text-left block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100">
                            Documentation
                        </button>
                        <button id="reportBtn" class="w-full text-left block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100">
                            Download Report
                        </button>
                    </div>
                </div>
            </div>
            <span id="statusIndicator" class="status-indicator"></span>
        </div>
    </div>

    <div class="flex flex-grow overflow-hidden p-2 gap-2">

        <div class="flex flex-col w-2/5 lg:w-1/3 flex-shrink-0 bg-white p-2 rounded-lg shadow-md overflow-hidden">
            <label for="editor" class="block text-sm font-medium text-gray-700 mb-1 flex-shrink-0"></label>
            <div id="messageArea" class="flex-shrink-0 text-xs max-h-[15vh] overflow-y-auto mb-1"></div>
            <div id="editor-container" class="flex-grow"></div>
        </div>

        <div class="flex flex-col flex-grow overflow-hidden">
            <div class="tabs flex flex-shrink-0">
                <button id="modelTabBtn" data-tab="model" class="tab-button" data-active="true">Model</button>
                <button id="simTabBtn" data-tab="simulation" class="tab-button" disabled>Simulation</button>
                <button id="interpTabBtn" data-tab="interpretation" class="tab-button" disabled>Interpretation</button>
            </div>
            <div class="flex-grow bg-gray-100 overflow-hidden relative">
                <div id="modelTabPanel" data-panel="model" class="tab-panel w-full h-full p-4 overflow-auto" data-active="true">
                     <div id="modelTitle" class="model-title hidden">Model Title Will Appear Here</div>
                     <div id="mermaidDiagram">
                         <div class="mermaid">graph TD; A["Loading..."];</div>
                     </div>
                </div>
                <div id="simulationTabPanel" data-panel="simulation" class="tab-panel w-full h-full p-4">
                    <div id="resultsChartContainer">
                        <canvas id="resultsChart"></canvas>
                        <p id="chartPlaceholder" class="absolute inset-0 flex items-center justify-center text-center text-gray-500">Click 'Run Simulation' to see results.</p>
                    </div>
                 </div>
                 <div id="interpretationTabPanel" data-panel="interpretation" class="tab-panel w-full h-full p-4 overflow-auto">
                     <div id="interpretationContent">
                         <p class="text-gray-500">Run simulation to generate interpretation...</p>
                     </div>
                 </div>
            </div>
        </div>

    </div>

    <div id="reportModal" class="modal-overlay hidden">
      <div class="modal-content">
        <button id="closeModalBtn" class="modal-close-btn">&times;</button>
        <h2 class="text-xl font-semibold mb-4">Generate PDF Report</h2>
        <p class="text-sm mb-4">Select sections to include:</p>
        <div class="space-y-2 mb-6">
          <div><label class="inline-flex items-center"><input type="checkbox" id="includeModelSummary" class="form-checkbox h-4 w-4 text-indigo-600" checked> <span class="ml-2 text-sm">Model Summary (Vars/Eqs)</span></label></div>
          <div><label class="inline-flex items-center"><input type="checkbox" id="includeSimSummary" class="form-checkbox h-4 w-4 text-indigo-600" checked> <span class="ml-2 text-sm">Simulation Summary (Metrics/Patterns)</span></label></div>
          <div><label class="inline-flex items-center"><input type="checkbox" id="includeLoops" class="form-checkbox h-4 w-4 text-indigo-600" checked> <span class="ml-2 text-sm">Feedback Loops</span></label></div>
          <div><label class="inline-flex items-center"><input type="checkbox" id="includeCharts" class="form-checkbox h-4 w-4 text-indigo-600" checked> <span class="ml-2 text-sm">Simulation Charts</span></label></div>
          <div><label class="inline-flex items-center"><input type="checkbox" id="includeDsl" class="form-checkbox h-4 w-4 text-indigo-600" checked> <span class="ml-2 text-sm">DSL Code</span></label></div>
        </div>
        <div class="flex flex-col space-y-3">
          <button id="generatePdfBtn" class="w-full px-4 py-2 bg-purple-600 text-white rounded-md shadow hover:bg-purple-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-purple-500">
            Generate PDF
          </button>
          <button id="generateHtmlBtn" class="w-full px-4 py-2 bg-blue-600 text-white rounded-md shadow hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500">
            Download HTML Report
          </button>
        </div>
      </div>
    </div>

    <!-- Load modules using ES modules -->
    <script type="module" src="scripts/app.js"></script>
</body>
</html>
