<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Dynamics DSL v1.2 Test</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script type="module">
        import { parseDSL, parseDSLv1_2 } from './scripts/parser.js';
        import { runSimulationv1_2 } from './scripts/simulation.js';
        
        // Test examples
        const examples = {
            v1_2: `# Population Growth Model with Resource Constraints
# Using DSL System Dynamics v1.2 Syntax

# Time configuration
constant StartTime = 2000
constant EndTime = 2100
constant TimeStep = 0.25

module Demography:
    stock Population = 1000
    
    constant BirthRate = 0.03
    constant DeathRate = 0.02
    constant CarryingCapacity = 2000
    
    calc PopulationPressure = Population / CarryingCapacity
    
    # Use a map to model how resource constraints affect birth rates
    map ResourceEffect: linear
        (0.0, 1.2)   # When population is low, birth rate increases
        (0.5, 1.0)   # At half capacity, normal birth rate
        (1.0, 0.8)   # At full capacity, reduced birth rate
        (1.5, 0.5)   # Above capacity, greatly reduced birth rate
        (2.0, 0.3)   # Far above capacity, severely reduced birth rate
    
    calc ActualBirthRate = BirthRate * map(ResourceEffect, PopulationPressure)
    
    # Births flow - adds to population
    flow Births:
        Population * ActualBirthRate -+> Population
    
    # Deaths flow - removes from population
    flow Deaths:
        Population * DeathRate --> Population`,
            
            legacy: `# Population Growth Model with Carrying Capacity
# Using Legacy v0.9.2 DSL Syntax

# Time settings
sim 0 100 0.25

# Stocks (initial values)
stock Population = 100

# Parameters (constants)
param BirthRate = 0.05
param DeathRate = 0.02
param CarryingCapacity = 500

# Auxiliary variables
aux PopulationPressure = Population / CarryingCapacity
aux ActualBirthRate = BirthRate * (1 - PopulationPressure * 0.7)

# Flows
flow Births = Population * ActualBirthRate
flow Deaths = Population * DeathRate

# Connect flows to stocks
connect Births -> Population
connect Population <- Deaths`
        };
        
        // Test both DSL versions on page load
        window.addEventListener('DOMContentLoaded', () => {
            document.getElementById('run-tests').addEventListener('click', runTests);
        });
        
        async function runTests() {
            const resultsElement = document.getElementById('test-results');
            resultsElement.innerHTML = '<h3>Running tests...</h3>';
            
            const results = [];
            
            // Test v1.2 DSL
            try {
                resultsElement.innerHTML += '<p>Testing v1.2 DSL parsing...</p>';
                const v1_2Model = parseDSLv1_2(examples.v1_2);
                
                if (v1_2Model.errors.length > 0) {
                    results.push(`❌ v1.2 DSL parsing failed: ${v1_2Model.errors.join(', ')}`);
                } else {
                    results.push('✅ v1.2 DSL parsing successful');
                    
                    // Test simulation
                    resultsElement.innerHTML += '<p>Testing v1.2 simulation...</p>';
                    const simResults = runSimulationv1_2(v1_2Model);
                    
                    if (!simResults) {
                        results.push('❌ v1.2 simulation failed');
                    } else {
                        results.push(`✅ v1.2 simulation successful with ${simResults.time.length} time points`);
                        
                        // Plot results
                        const ctx = document.getElementById('v1_2-chart').getContext('2d');
                        plotResults(simResults, ctx, 'Population (v1.2)', 'Demography.Population');
                    }
                }
            } catch (error) {
                results.push(`❌ v1.2 test error: ${error.message}`);
                console.error('v1.2 error:', error);
            }
            
            // Test legacy DSL
            try {
                resultsElement.innerHTML += '<p>Testing legacy DSL parsing...</p>';
                const legacyModel = parseDSL(examples.legacy);
                
                if (legacyModel.errors.length > 0) {
                    results.push(`❌ Legacy DSL parsing failed: ${legacyModel.errors.join(', ')}`);
                } else {
                    results.push('✅ Legacy DSL parsing successful');
                    
                    // Test simulation
                    resultsElement.innerHTML += '<p>Testing legacy simulation...</p>';
                    const simResults = runSimulationv1_2(legacyModel);
                    
                    if (!simResults) {
                        results.push('❌ Legacy simulation failed');
                    } else {
                        results.push(`✅ Legacy simulation successful with ${simResults.time.length} time points`);
                        
                        // Plot results
                        const ctx = document.getElementById('legacy-chart').getContext('2d');
                        plotResults(simResults, ctx, 'Population (Legacy)', 'Population');
                    }
                }
            } catch (error) {
                results.push(`❌ Legacy test error: ${error.message}`);
                console.error('Legacy error:', error);
            }
            
            // Display results
            resultsElement.innerHTML = results.map(r => `<p>${r}</p>`).join('');
        }
        
        function plotResults(results, ctx, label, dataKey) {
            const data = {
                labels: results.time,
                datasets: [{
                    label: label,
                    data: results.stocks[dataKey] || [],
                    borderColor: 'rgb(75, 192, 192)',
                    tension: 0.1
                }]
            };
            
            new Chart(ctx, {
                type: 'line',
                data: data,
                options: {
                    responsive: true,
                    plugins: {
                        title: {
                            display: true,
                            text: label
                        }
                    }
                }
            });
        }
    </script>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        .test-container {
            margin-bottom: 30px;
        }
        button {
            background-color: #4CAF50;
            border: none;
            color: white;
            padding: 15px 32px;
            text-align: center;
            text-decoration: none;
            display: inline-block;
            font-size: 16px;
            margin: 20px 0;
            cursor: pointer;
            border-radius: 4px;
        }
        .chart-container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
        }
        .chart-box {
            flex: 1;
            min-width: 400px;
            height: 300px;
            border: 1px solid #ddd;
            padding: 10px;
            box-sizing: border-box;
        }
    </style>
</head>
<body>
    <h1>System Dynamics DSL v1.2 Test</h1>
    <p>This page tests both the v1.2 and legacy DSL implementations.</p>
    
    <button id="run-tests">Run Tests</button>
    
    <div id="test-results" class="test-container">
        <p>Click "Run Tests" to start testing.</p>
    </div>
    
    <div class="chart-container">
        <div class="chart-box">
            <canvas id="v1_2-chart"></canvas>
        </div>
        <div class="chart-box">
            <canvas id="legacy-chart"></canvas>
        </div>
    </div>
</body>
</html>
