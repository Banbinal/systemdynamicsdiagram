<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sweep Mini Test</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        #debugConsole {
            height: 300px;
            overflow-y: auto;
            background-color: #f5f5f5;
            padding: 10px;
            border: 1px solid #ccc;
            font-family: monospace;
            font-size: 12px;
        }
        .error { color: red; }
        .warning { color: orange; }
        .success { color: green; }
        .info { color: blue; }
    </style>
</head>
<body class="p-6">
    <h1 class="text-2xl font-bold mb-4">Parameter Sweep Test</h1>
    
    <div class="mb-4">
        <button id="testButton" class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded">
            Run All Steps
        </button>
        
        <button id="parseButton" class="bg-green-500 hover:bg-green-700 text-white font-bold py-2 px-4 rounded ml-2">
            1. Parse Model
        </button>
        
        <button id="validateButton" class="bg-green-500 hover:bg-green-700 text-white font-bold py-2 px-4 rounded ml-2">
            2. Validate Model
        </button>
        
        <button id="compileButton" class="bg-green-500 hover:bg-green-700 text-white font-bold py-2 px-4 rounded ml-2">
            3. Compile Expressions
        </button>
    </div>
    
    <div class="grid grid-cols-2 gap-4">
        <div>
            <h2 class="text-xl font-bold mb-2">Model Input</h2>
            <textarea id="modelInput" class="w-full h-64 border border-gray-300 p-2 font-mono" readonly></textarea>
        </div>
        
        <div>
            <h2 class="text-xl font-bold mb-2">Debug Console</h2>
            <div id="debugConsole"></div>
        </div>
    </div>
    
    <div id="result" class="mt-4 p-4 border border-gray-300 bg-gray-100 hidden">
        <h2 class="text-xl font-bold mb-2">Result</h2>
        <pre id="resultContent" class="whitespace-pre-wrap"></pre>
    </div>
    
    <script>
        // Debug function to log messages to the debug console
        function debugLog(message, type = 'info') {
            const debugConsole = document.getElementById('debugConsole');
            const logEntry = document.createElement('div');
            logEntry.classList.add(type);
            logEntry.textContent = message;
            debugConsole.appendChild(logEntry);
            debugConsole.scrollTop = debugConsole.scrollHeight;
            console.log(message);
        }
        
        // Override console.error to also display in our debug console
        const originalConsoleError = console.error;
        console.error = function() {
            debugLog(Array.from(arguments).join(' '), 'error');
            originalConsoleError.apply(console, arguments);
        };
        
        // Override console.log for debugging
        const originalConsoleLog = console.log;
        console.log = function() {
            const args = Array.from(arguments);
            const message = typeof args[0] === 'string' && args[0].startsWith('[DEBUG]') ? 
                args.join(' ') : args.join(' ');
            debugLog(message);
            originalConsoleLog.apply(console, arguments);
        };
        
        // Load modules
        import('./scripts/parser.js').then(async (parserModule) => {
            debugLog('Page loaded. Modules imported successfully.');
            
            // Get the model text from a file
            try {
                const response = await fetch('test_simple_model.txt');
                if (!response.ok) {
                    throw new Error(`Failed to load model text: ${response.status} ${response.statusText}`);
                }
                const modelText = await response.text();
                document.getElementById('modelInput').value = modelText;
                debugLog(`Loaded model text: ${modelText.length} characters`);
            } catch (error) {
                console.error(`Error loading model text: ${error.message}`);
            }
            
            // Define test steps
            let parsedModel = null;
            
            // Step 1: Parse the model
            function parseModel() {
                debugLog('Step 1: Parsing model...');
                const modelText = document.getElementById('modelInput').value;
                debugLog(`Model input length: ${modelText.length} characters`);
                
                try {
                    parsedModel = parserModule.parseDSLv1_2(modelText);
                    debugLog('Model parsing completed.');
                    
                    if (parsedModel.errors && parsedModel.errors.length > 0) {
                        debugLog(`Parsing errors: ${parsedModel.errors.length}`, 'error');
                        parsedModel.errors.forEach(error => {
                            debugLog(`Error: ${error}`, 'error');
                        });
                    } else {
                        debugLog('Model parsed successfully!', 'success');
                        document.getElementById('result').classList.remove('hidden');
                        document.getElementById('resultContent').textContent = 
                            JSON.stringify(parsedModel, (key, value) => {
                                // Skip functions in the output
                                if (typeof value === 'function') {
                                    return '[Function]';
                                }
                                return value;
                            }, 2);
                    }
                    
                    return parsedModel;
                } catch (error) {
                    console.error(`Error parsing model: ${error.message}`);
                    console.error(error.stack);
                    return null;
                }
            }
            
            // Step 2: Validate the model
            function validateModel() {
                if (!parsedModel) {
                    parsedModel = parseModel();
                    if (!parsedModel) return;
                }
                
                debugLog('Step 2: Validating model structure...');
                
                try {
                    // Check model structure
                    const constantCount = Object.keys(parsedModel.constants || {}).length;
                    const stockCount = Object.keys(parsedModel.stocks || {}).length;
                    const flowCount = Object.keys(parsedModel.flows || {}).length;
                    const calcCount = Object.keys(parsedModel.calcs || {}).length;
                    const sweepCount = Object.keys(parsedModel.sweeps || {}).length;
                    
                    debugLog(`Found ${constantCount} constants, ${stockCount} stocks, ${flowCount} flows, ${calcCount} calcs, ${sweepCount} sweeps`);
                    
                    // Check for parameter sweeps
                    if (sweepCount > 0) {
                        debugLog('Parameter sweeps found:', 'success');
                        for (const param in parsedModel.sweeps) {
                            debugLog(`  - ${param}: [${parsedModel.sweeps[param].join(', ')}]`);
                        }
                    } else {
                        debugLog('No parameter sweeps found.', 'warning');
                    }
                    
                    return true;
                } catch (error) {
                    console.error(`Error validating model: ${error.message}`);
                    console.error(error.stack);
                    return false;
                }
            }
            
            // Step 3: Compile expressions
            function compileExpressions() {
                if (!parsedModel) {
                    parsedModel = parseModel();
                    if (!parsedModel) return;
                }
                
                if (!validateModel()) return;
                
                debugLog('Step 3: Compiling expressions...');
                
                try {
                    // Test expression compilation
                    debugLog('Testing expression compilation for constants...');
                    for (const name in parsedModel.constants) {
                        const constant = parsedModel.constants[name];
                        debugLog(`  - ${name}: ${constant.expression}`);
                    }
                    
                    debugLog('Testing expression compilation for stocks...');
                    for (const name in parsedModel.stocks) {
                        const stock = parsedModel.stocks[name];
                        debugLog(`  - ${name}: ${stock.expression}`);
                    }
                    
                    debugLog('Testing expression compilation for flows...');
                    for (const name in parsedModel.flows) {
                        const flow = parsedModel.flows[name];
                        if (flow.effects && flow.effects.length > 0) {
                            flow.effects.forEach((effect, index) => {
                                debugLog(`  - ${name} effect ${index}: ${effect.expression}`);
                            });
                        } else if (flow.rate) {
                            debugLog(`  - ${name}: ${flow.rate}`);
                        }
                    }
                    
                    return true;
                } catch (error) {
                    console.error(`Error compiling expressions: ${error.message}`);
                    console.error(error.stack);
                    return false;
                }
            }
            
            // Attach event handlers
            document.getElementById('testButton').addEventListener('click', function() {
                parseModel();
                validateModel();
                compileExpressions();
            });
            
            document.getElementById('parseButton').addEventListener('click', parseModel);
            document.getElementById('validateButton').addEventListener('click', validateModel);
            document.getElementById('compileButton').addEventListener('click', compileExpressions);
            
        }).catch(error => {
            console.error(`Error loading modules: ${error.message}`);
            console.error(error.stack);
        });
    </script>
</body>
</html>
